<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="jtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="jtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Official Golden Diamond Emblem with JT Monogram -->
  <g transform="translate(6, 4)" filter="url(#jtGlow)">
    <rect 
      x="8" 
      y="8" 
      width="24" 
      height="24" 
      rx="5" 
      transform="rotate(45 20 20)" 
      stroke="url(#jtGrad)" 
      stroke-width="2.5" 
      fill="rgba(245, 158, 11, 0.15)"
    />
    <text 
      x="20" 
      y="25" 
      fill="#FFFFFF" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Instrument Sans', sans-serif" 
      font-weight="900" 
      font-size="13" 
      letter-spacing="-0.5" 
      text-anchor="middle"
    >JT</text>
  </g>

  <!-- Horizontal Wordmark: Jagat in Crisp White, Turkiya in Vibrant Gold -->
  <text 
    x="56" 
    y="31" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Instrument Sans', sans-serif" 
    font-weight="800" 
    font-size="22" 
    letter-spacing="-0.3"
  >
    <tspan fill="#FFFFFF">Jagat</tspan>
    <tspan fill="#F59E0B" dx="6">Turkiya</tspan>
  </text>
</svg>
