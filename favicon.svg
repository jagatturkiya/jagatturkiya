<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Subtle dark executive base for high contrast -->
  <rect width="64" height="64" rx="14" fill="#0A0A0C"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>
  
  <!-- Official Golden Diamond with PURE WHITE JT -->
  <g transform="translate(32, 32)">
    <rect 
      x="-18" 
      y="-18" 
      width="36" 
      height="36" 
      rx="6" 
      transform="rotate(45)" 
      stroke="#F59E0B" 
      stroke-width="3" 
      fill="rgba(245, 158, 11, 0.16)"
    />
    <!-- Bold Pure White JT Letters -->
    <text 
      x="0" 
      y="7" 
      fill="#FFFFFF" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Instrument Sans', sans-serif" 
      font-weight="900" 
      font-size="18" 
      letter-spacing="-0.5" 
      text-anchor="middle"
    >JT</text>
  </g>
</svg>
