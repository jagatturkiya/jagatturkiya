<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Executive Obsidian squircle background for high contrast on light/dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0A0A0C"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
  
  <!-- Signature Radiant Golden Rhombus Diamond -->
  <g transform="translate(32, 32)" filter="url(#glow)">
    <rect 
      x="-18" 
      y="-18" 
      width="36" 
      height="36" 
      rx="6" 
      transform="rotate(45)" 
      fill="url(#goldGrad)" 
      stroke="#FFFBEB" 
      stroke-width="1.5"
    />
    <!-- Deep Obsidian JT Letters - Super High Contrast & Bold -->
    <text 
      x="0" 
      y="7" 
      fill="#0A0A0C" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Instrument Sans', sans-serif" 
      font-weight="900" 
      font-size="18" 
      letter-spacing="-0.5" 
      text-anchor="middle"
    >JT</text>
  </g>
</svg>
